[project]
name = "bloom-learning-backend"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pypdf>=6.13.0",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.0",
    "pillow>=12.0.0",
    "trafilatura==2.3.1",
    "langfuse>=5.1.0",
    "mammoth>=1.13.0",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "markdownify>=1.2.3",
    "xlrd>=2.0.2",
    "pypdfium2>=5.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: 需要真实 Postgres，设置 TEST_DATABASE_URL 后用 -m postgres 运行"]

[dependency-groups]
dev = [
    "opencc>=1.4.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
